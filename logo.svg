<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" fill="none">
  <!-- 正方形 viewBox 是 NewAPI 的硬要求：它的 React 容器是正方形且 object-fit:cover，
       非正方形会被裁掉左右两边（弧形两端消失）。所以这里不裁画布，改成把图形
       居中——原图形只占 y 9~53，贴在顶部，看起来就是“logo 在上面”。
       图形实际范围 x 9~91、y 9~53.25，居中需往下移 (100-44.25)/2-9 = 18.875。 -->
  <g transform="translate(0, 18.875)">
