[package]
name = "jiucaihezi-app"
version = "2.0.9"
description = "韭菜盒子 — 你的本地 AI 工作台"
authors = ["you"]
edition = "2024"

[lib]
name = "jiucaihezi_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
keyring = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1", features = ["io-util", "process", "sync", "time", "macros", "signal"] }
flate2 = "1"
tar = "0.4"
futures = "0.3"
futures-util = "0.3"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-deep-link = "2"
arboard = "3"
md5 = "0.7"
dirs-next = "2.0"
tauri-plugin-updater = "2.10.1"
notify = "8.2"
tauri-plugin-opener = "2.5.4"

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
rfd = "0.15"
trash = "5.2"

[target.'cfg(target_os = "ios")'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
# Temporary iOS compatibility patch. Remove once Tauri/Wry releases the upstream fix for #14675.
tauri-runtime-wry = { path = "vendor/tauri-runtime-wry" }
# Official Tao iOS fixes not yet available in the crates.io release used by Tauri 2.11.
tao = { git = "https://github.com/tauri-apps/tao", rev = "729bbcad70a1c912ceb9b3c03cfc250c63e8a368" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
