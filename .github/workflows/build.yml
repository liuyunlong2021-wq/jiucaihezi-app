name: Build Desktop App
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-arm:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install
      - name: Sync version from Git tag
        run: node scripts/set-version.mjs --auto
      - name: Frontend build (skip tests)
        env:
          VITE_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.GITHUB_OAUTH_CLIENT_ID }}
        run: pnpm exec vite build

      - id: build-macos-arm
        continue-on-error: true
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "韭菜盒子 ${{ github.ref_name }}"
          releaseBody: |
            ## 韭菜盒子 ${{ github.ref_name }}

            ### macOS Apple Silicon (M 芯片)
            | 文件 | SHA256 |
            |------|--------|
            | 韭菜盒子_${{ github.ref_name }}_aarch64.dmg | 见 .sha256 文件 |

            ### 校验
            下载后请校验 SHA256：`shasum -a 256 -c 韭菜盒子_*.dmg.sha256`
          tauriScript: pnpm tauri
          args: --target aarch64-apple-darwin --config '{"build":{"beforeBuildCommand":""}}'

      - name: Retry macOS ARM build after transient signing failure
        if: steps.build-macos-arm.outcome == 'failure'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "韭菜盒子 ${{ github.ref_name }}"
          releaseBody: |
            ## 韭菜盒子 ${{ github.ref_name }}

            ### macOS Apple Silicon (M 芯片)
            | 文件 | SHA256 |
            |------|--------|
            | 韭菜盒子_${{ github.ref_name }}_aarch64.dmg | 见 .sha256 文件 |

            ### 校验
            下载后请校验 SHA256：`shasum -a 256 -c 韭菜盒子_*.dmg.sha256`
          tauriScript: pnpm tauri
          args: --target aarch64-apple-darwin --config '{"build":{"beforeBuildCommand":""}}'

      - name: Notarize macOS app (ARM)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          # 优化网络连接设置，增大 HTTP 超时阈值，解决 Apple notary 上传卡住和连接中断问题
          defaults write com.apple.gke.notary.tool nt-upload-connection-timeout 300
          
          for dmg in src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg; do
            echo "公证: $dmg"
            # 引入重试机制与明确的超时机制，防止单次长连接因网络瞬断导致整条流水线报错
            for i in {1..3}; do
              echo "开始提交公证（第 $i 次尝试）..."
              if xcrun notarytool submit "$dmg" \
                --apple-id "$APPLE_ID" \
                --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_APP_PASSWORD" \
                --timeout 30m \
                --wait; then
                echo "✅ 公证成功"
                break
              else
                echo "⚠️ 第 $i 次尝试失败，可能是网络抖动，等待 30 秒后重试..."
                if [ $i -eq 3 ]; then
                  echo "❌ 已达到最大重试次数，公证失败"
                  exit 1
                fi
                sleep 30
              fi
            done
            xcrun stapler staple "$dmg"
          done

      - name: Generate SHA256
        run: |
          for dmg in src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg; do
            shasum -a 256 "$dmg" > "${dmg}.sha256"
          done

      - name: Smoke test — memory app boundary (ARM)
        run: |
          DMG=$(ls src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg 2>/dev/null | head -1)
          if [ -z "$DMG" ]; then echo "⚠️ 未找到 DMG，跳过 smoke test"; exit 0; fi
          hdiutil attach "$DMG" -quiet
          APP_PATH=$(find /Volumes -maxdepth 2 -name "*.app" 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then echo "❌ 未找到 .app"; exit 1; fi
          echo "APP_PATH=$APP_PATH"
          if find "$APP_PATH" -iname '*opencode*' -print -quit | grep -q .; then
            echo "❌ 记忆 APP 不得携带 OpenCode sidecar"
            exit 1
          fi
          echo "✅ 未携带 OpenCode sidecar"
          echo "=== 启动存活(15s) ==="
          MAIN_BIN=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Contents/Info.plist")
          "$APP_PATH/Contents/MacOS/$MAIN_BIN" & APP_PID=$!; sleep 15
          if kill -0 $APP_PID 2>/dev/null; then echo "✅ 存活"; kill $APP_PID; else echo "❌ 提前退出"; exit 1; fi
          hdiutil detach "$(echo "$APP_PATH" | sed -E 's#(/Volumes/[^/]+).*#\1#')" -quiet || true

      - name: Sign + upload to server (ARM)
        if: startsWith(github.ref, 'refs/tags/v') && false
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          BUNDLE="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg"
          echo "Signing DMG for v$VERSION..."
          for dmg in "$BUNDLE"/*.dmg; do
            [ -f "$dmg" ] || continue
            pnpm tauri signer sign "$dmg" --private-key "$TAURI_SIGNING_PRIVATE_KEY" --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" > "${dmg}.sig"
            echo "✅ signed: $(basename "$dmg")"
          done
          echo "$DEPLOY_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ${DEPLOY_USER}@${DEPLOY_HOST} "mkdir -p /opt/updates/${VERSION}"
          scp -i /tmp/deploy_key -o StrictHostKeyChecking=no "$BUNDLE"/*.dmg "$BUNDLE"/*.dmg.sig ${DEPLOY_USER}@${DEPLOY_HOST}:/opt/updates/${VERSION}/
          rm /tmp/deploy_key
          echo "✅ uploaded"

  macos-intel:
    # 使用 macos-15-intel（原生 Intel x86_64）而非 macos-latest（ARM64），
    # 避免交叉编译 libsqlite3-sys / ring 等 C 依赖到 x86_64 的潜在问题。
    # GitHub 已公告 macos-13 退役；fallback: macos-13 或交叉编译 + 显式 SDKROOT。
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install

      - name: Sync version from Git tag
        run: node scripts/set-version.mjs --auto

      - name: Install Rust x86_64 target
        run: rustup target add x86_64-apple-darwin

      - name: Frontend build (skip tests)
        env:
          VITE_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.GITHUB_OAUTH_CLIENT_ID }}
        run: pnpm exec vite build

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "韭菜盒子 ${{ github.ref_name }}"
          releaseBody: |
            ## 韭菜盒子 ${{ github.ref_name }}

            ### macOS Intel
            | 文件 | SHA256 |
            |------|--------|
            | 韭菜盒子_${{ github.ref_name }}_x64.dmg | 见 .sha256 文件 |

            ### 校验
            下载后请校验 SHA256：`shasum -a 256 -c 韭菜盒子_*.dmg.sha256`
          tauriScript: pnpm tauri
          # macos-15-intel 没有可用 Finder 会话；Tauri 默认 DMG 的 AppleScript 美化会失败。
          # 先只生成已签名 .app，下一步用 hdiutil 生成可安装 DMG。
          args: --target x86_64-apple-darwin --bundles app --config '{"build":{"beforeBuildCommand":""}}'

      - name: Create DMG (Intel, headless)
        run: |
          set -euo pipefail
          APP="src-tauri/target/x86_64-apple-darwin/release/bundle/macos/韭菜盒子.app"
          BUNDLE="src-tauri/target/x86_64-apple-darwin/release/bundle/dmg"
          SOURCE=$(mktemp -d)
          DMG="$BUNDLE/韭菜盒子_${GITHUB_REF_NAME}_x64.dmg"
          mkdir -p "$BUNDLE"
          cp -R "$APP" "$SOURCE/韭菜盒子.app"
          ln -s /Applications "$SOURCE/Applications"
          hdiutil create -volname "韭菜盒子" -srcfolder "$SOURCE" -ov -format UDZO "$DMG"
          rm -rf "$SOURCE"
          gh release upload "$GITHUB_REF_NAME" "$DMG" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notarize macOS app (Intel)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          # 优化网络连接设置，增大 HTTP 超时阈值，解决 Apple notary 上传卡住和连接中断问题
          defaults write com.apple.gke.notary.tool nt-upload-connection-timeout 300
          
          for dmg in src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg; do
            echo "公证: $dmg"
            # 引入重试机制与明确的超时机制，防止单次长连接因网络瞬断导致整条流水线报错
            for i in {1..3}; do
              echo "开始提交公证（第 $i 次尝试）..."
              if xcrun notarytool submit "$dmg" \
                --apple-id "$APPLE_ID" \
                --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_APP_PASSWORD" \
                --timeout 30m \
                --wait; then
                echo "✅ 公证成功"
                break
              else
                echo "⚠️ 第 $i 次尝试失败，可能是网络抖动，等待 30 秒后重试..."
                if [ $i -eq 3 ]; then
                  echo "❌ 已达到最大重试次数，公证失败"
                  exit 1
                fi
                sleep 30
              fi
            done
            xcrun stapler staple "$dmg"
          done

      - name: Generate SHA256
        run: |
          for dmg in src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg; do
            shasum -a 256 "$dmg" > "${dmg}.sha256"
          done

      - name: Smoke test — memory app boundary (Intel)
        run: |
          DMG=$(ls src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg 2>/dev/null | head -1)
          if [ -z "$DMG" ]; then echo "⚠️ 未找到 DMG，跳过 smoke test"; exit 0; fi
          hdiutil attach "$DMG" -quiet
          APP_PATH=$(find /Volumes -maxdepth 2 -name "*.app" 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then echo "❌ 未找到 .app"; exit 1; fi
          echo "APP_PATH=$APP_PATH"
          if find "$APP_PATH" -iname '*opencode*' -print -quit | grep -q .; then
            echo "❌ 记忆 APP 不得携带 OpenCode sidecar"
            exit 1
          fi
          echo "✅ 未携带 OpenCode sidecar"
          echo "=== 架构校验 ==="
          MAIN_BIN=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Contents/Info.plist")
          file "$APP_PATH/Contents/MacOS/$MAIN_BIN"
          echo "=== 启动存活(15s) ==="
          "$APP_PATH/Contents/MacOS/$MAIN_BIN" & APP_PID=$!; sleep 15
          if kill -0 $APP_PID 2>/dev/null; then echo "✅ 存活"; kill $APP_PID; else echo "❌ 提前退出"; exit 1; fi
          hdiutil detach "$(echo "$APP_PATH" | sed -E 's#(/Volumes/[^/]+).*#\1#')" -quiet || true

      - name: Sign + upload to server (Intel)
        if: startsWith(github.ref, 'refs/tags/v') && false
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          BUNDLE="src-tauri/target/x86_64-apple-darwin/release/bundle/dmg"
          for dmg in "$BUNDLE"/*.dmg; do
            [ -f "$dmg" ] || continue
            pnpm tauri signer sign "$dmg" --private-key "$TAURI_SIGNING_PRIVATE_KEY" --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" > "${dmg}.sig"
          done
          echo "$DEPLOY_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ${DEPLOY_USER}@${DEPLOY_HOST} "mkdir -p /opt/updates/${VERSION}"
          scp -i /tmp/deploy_key -o StrictHostKeyChecking=no "$BUNDLE"/*.dmg "$BUNDLE"/*.dmg.sig ${DEPLOY_USER}@${DEPLOY_HOST}:/opt/updates/${VERSION}/
          rm /tmp/deploy_key

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'pnpm' }
      - run: pnpm install
      - name: Sync version from Git tag
        run: node scripts/set-version.mjs --auto
      - name: Frontend build (skip tests)
        env:
          VITE_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.GITHUB_OAUTH_CLIENT_ID }}
        run: pnpm exec vue-tsc -b && pnpm exec vite build

      - name: Build Windows app (portable)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          '{"build":{"beforeBuildCommand":""}}' | Set-Content -Encoding UTF8 tauri.windows.ci.conf.json
          pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis --config tauri.windows.ci.conf.json

          $nsisDir = "src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis"
          $setup = Get-ChildItem "$nsisDir\*.exe" | Select-Object -First 1
          if (-not $setup) {
            throw "未生成 Windows NSIS 安装器"
          }
          $setupPath = "src-tauri\target\韭菜盒子_${env:GITHUB_REF_NAME}_x64_windows_setup.exe"
          Copy-Item $setup.FullName $setupPath

      - name: Smoke test — Windows app startup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "src-tauri\target\x86_64-pc-windows-msvc\release\jiucaihezi-app.exe"
          $stderr = Join-Path $env:RUNNER_TEMP "jiucaihezi-startup.stderr.log"
          $app = Start-Process -FilePath $exe -PassThru -RedirectStandardError $stderr
          Start-Sleep -Seconds 15
          if ($app.HasExited) {
            if (Test-Path $stderr) { Get-Content $stderr }
            throw "Windows 应用启动后提前退出，exit=$($app.ExitCode)"
          }
          Stop-Process -Id $app.Id -Force
          Write-Host "✅ Windows 应用启动存活 15 秒"

      - name: Package Windows portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDir = "src-tauri\target\x86_64-pc-windows-msvc\release"
          $portableRoot = "src-tauri\target\windows-portable"
          $portableDir = Join-Path $portableRoot "韭菜盒子"
          $zipPath = "src-tauri\target\韭菜盒子_${env:GITHUB_REF_NAME}_x64_windows_portable.zip"
          $setupPath = "src-tauri\target\韭菜盒子_${env:GITHUB_REF_NAME}_x64_windows_setup.exe"

          if (Test-Path $portableRoot) {
            Remove-Item $portableRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Force $portableDir | Out-Null

          Copy-Item "$releaseDir\jiucaihezi-app.exe" (Join-Path $portableDir "韭菜盒子.exe")
          # 生成 README.txt（Windows 用户解压后可见）
          $readme = @"
          韭菜盒子 — Windows 便携版
          ============================

          使用前必读：

          1. 普通用户请运行 Release 中的 `x64_windows_setup.exe`，安装器会处理 WebView2 Runtime。

             便携 ZIP 只适合已经安装 WebView2 的用户；请先解压整个 zip 包（不要直接在 zip 里双击运行！）

          2. 韭菜盒子需要 Microsoft Edge WebView2 Runtime。
             如果打开时提示缺少 WebView2，请下载安装：
             https://go.microsoft.com/fwlink/p/?LinkId=2124703
             （Windows 11 通常已自带；Windows 10 可能需要手动安装）

          3. 如果启动后卡在 logo 画面，请尝试以管理员身份运行。

          4. 数据存储位置：%APPDATA%\com.jiucaihezi.desktop\

          问题反馈：https://github.com/liuyunlong2021-wq/jiucaihezi-app/issues
          "@
          $readme | Out-File -Encoding UTF8 (Join-Path $portableDir "README.txt")

          Compress-Archive -Path $portableDir -DestinationPath $zipPath -Force
          Get-Item $zipPath | Format-List FullName,Length
          Get-Item $setupPath | Format-List FullName,Length

      - name: Smoke test — Windows portable zip contents
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zipPath = "src-tauri\target\韭菜盒子_${env:GITHUB_REF_NAME}_x64_windows_portable.zip"
          $setupPath = "src-tauri\target\韭菜盒子_${env:GITHUB_REF_NAME}_x64_windows_setup.exe"
          if (-not (Test-Path $zipPath)) {
            Write-Host "⚠️ 未找到 zip，跳过 smoke test"
            exit 0
          }
          if (-not (Test-Path $setupPath)) {
            Write-Host "❌ 缺少 NSIS 安装器: $setupPath"
            exit 1
          }
          Write-Host "✅ NSIS 安装器存在"
          Write-Host "=== ZIP 内容校验 ==="
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          $names = $zip.Entries | ForEach-Object { $_.Name }
          $zip.Dispose()
          $required = @("韭菜盒子.exe", "README.txt")
          foreach ($name in $required) {
            if ($name -in $names) {
              Write-Host "✅ $name"
            } else {
              Write-Host "❌ 缺失: $name"
              exit 1
            }
          }
          if ($names | Where-Object { $_ -like "*opencode*" }) {
            Write-Host "❌ 记忆 APP 不得携带 OpenCode sidecar"
            exit 1
          }
          $sizeMB = [math]::Round((Get-Item $zipPath).Length / 1MB, 1)
          Write-Host "✅ ZIP 大小: ${sizeMB}MB, 文件数: $($names.Count)"

      - name: Upload Windows portable zip
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${env:GITHUB_REF_NAME}"
          $zipPath = "src-tauri\target\韭菜盒子_${tag}_x64_windows_portable.zip"
          $setupPath = "src-tauri\target\韭菜盒子_${tag}_x64_windows_setup.exe"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --notes "Desktop builds"
          }
          if (-not (Test-Path $zipPath) -or -not (Test-Path $setupPath)) { throw "Windows 发布资产缺失" }
          gh release upload $tag $zipPath $setupPath --clobber

      - name: Upload Windows zip to server
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "$DEPLOY_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ${DEPLOY_USER}@${DEPLOY_HOST} "mkdir -p /opt/updates/${VERSION}"
          scp -i /tmp/deploy_key -o StrictHostKeyChecking=no src-tauri/target/韭菜盒子_*_x64_windows_portable.zip src-tauri/target/韭菜盒子_*_x64_windows_setup.exe ${DEPLOY_USER}@${DEPLOY_HOST}:/opt/updates/${VERSION}/
          rm /tmp/deploy_key

  publish-manifest:
    needs: [macos-arm, macos-intel, windows]
    runs-on: ubuntu-latest
    # OTA is disabled until a Tauri minisign key pair is provisioned.
    if: startsWith(github.ref, 'refs/tags/v') && false
    steps:
      - name: Generate and upload latest.json
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "$DEPLOY_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          # 在服务器端生成 latest.json + 清理旧版本
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ${DEPLOY_USER}@${DEPLOY_HOST} "bash -s" << 'REMOTE_SCRIPT'
          set -e
          cd /opt/updates
          V="${VERSION}"
          if [ -z "$V" ]; then echo "No versions found"; exit 1; fi
          ARM_DMG=$(ls $V/*aarch64.dmg 2>/dev/null | head -1)
          INTEL_DMG=$(ls $V/*x64.dmg 2>/dev/null | grep -v aarch64 | head -1)
          WIN_INSTALLER=$(ls $V/*windows_setup.exe 2>/dev/null | head -1)
          WIN_ZIP=$(ls $V/*windows_portable.zip 2>/dev/null | head -1)
          WIN_ASSET="$WIN_INSTALLER"
          if [ -z "$WIN_ASSET" ]; then WIN_ASSET="$WIN_ZIP"; fi
          for asset in "$ARM_DMG" "$INTEL_DMG" "$WIN_ASSET"; do
            [ -f "$asset" ] || { echo "Missing release asset: $asset"; exit 1; }
          done
          ARM_SIG=$(cat "$V/$(basename "$ARM_DMG" .dmg).dmg.sig" 2>/dev/null | base64 -w0 || echo '')
          INTEL_SIG=$(cat "$V/$(basename "$INTEL_DMG" .dmg).dmg.sig" 2>/dev/null | base64 -w0 || echo '')
          [ -n "$ARM_SIG" ] && [ -n "$INTEL_SIG" ] || { echo "Missing updater signature"; exit 1; }
          cat > /opt/updates/latest.json << EOF
          {
            "version": "$V",
            "notes": "更新内容见 GitHub Releases",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "$ARM_SIG",
                "url": "https://api.jiucaihezi.studio/updates/$V/$(basename "$ARM_DMG")"
              },
              "darwin-x86_64": {
                "signature": "$INTEL_SIG",
                "url": "https://api.jiucaihezi.studio/updates/$V/$(basename "$INTEL_DMG")"
              },
              "windows-x86_64": {
                "url": "https://api.jiucaihezi.studio/updates/$V/$(basename "$WIN_ASSET")",
                "signature": ""
              }
            }
          }
          EOF
          echo "latest.json generated for v$V"
          # 清理旧版本（保留最新 5 版）
          ls -d */ 2>/dev/null | sort -V | head -n -5 | xargs rm -rf
          REMOTE_SCRIPT
          rm /tmp/deploy_key
